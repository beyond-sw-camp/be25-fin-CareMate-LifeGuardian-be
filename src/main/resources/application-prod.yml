spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
  cloud:
    aws:
      region:
        static: ap-northeast-2
      parameterstore:
        region: ap-northeast-2


  config:
    import: "aws-parameterstore:/config/lifeguardian/prod/"
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sslMode=trust
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: warn
    com.caremate.lifeguardian: info

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

jwt:
  secret: ${JWT_SECRET}

aws:
  lambda:
    recommend-url: ${AWS_LAMBDA_RECOMMEND_URL:http://localhost:8000/recommend}
  cloudwatch:
    region: ap-northeast-2
    access-key: ""     # ~/.aws/credentials 파일을 읽도록 빈 값 처리
    secret-key: ""     # ~/.aws/credentials 파일을 읽도록 빈 값 처리

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGIN}

  esg:
    batch:
      enabled: true   # 자동 실행 비활성화 (로컬 기본)
    cloudwatch:
      enabled: true

  security:
    rrn-pepper: ${RRN_PEPPER}

  report:
    storage:
      bucket: ${S3_BUCKET}
      region: ${S3_REGION:ap-northeast-2}
      key-prefix: ${S3_REPORT_KEY_PREFIX:reports}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
      path-style-access: false

    pdf:
      font-location: ${REPORT_PDF_FONT_LOCATION:classpath:/fonts/Pretendard-Regular.ttf}

    batch:
      enabled: ${REPORT_BATCH_ENABLED:false}
      cron: ${REPORT_BATCH_CRON:0 0 3 * * *}
      zone: ${REPORT_BATCH_ZONE:Asia/Seoul}

  lifecycle:
    batch:
      enabled: ${LIFECYCLE_BATCH_ENABLED:false}
      cron: ${LIFECYCLE_BATCH_CRON:0 1 * * * *}
      zone: ${LIFECYCLE_BATCH_ZONE:Asia/Seoul}
